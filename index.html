<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>箏心如願 · Una's Guzheng 音樂會節目冊</title>
<meta name="description" content="2026/12/12 箏心如願 Una's Guzheng 音樂會節目冊">
<meta name="theme-color" content="#a76a41">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 中文：思源宋體（Google Fonts 名稱 Noto Serif TC）／英文手寫：Sacramento（近似 Harshita） -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#a76a41;
  --cream:#fbeee0;
  --gold:#f5d9b4;
  --ease:cubic-bezier(.22,.8,.24,1);
  --cn:"Noto Serif TC","Source Han Serif TC","Source Han Serif","Songti TC","PMingLiU",serif;
  --script:"Harshita","Sacramento","Snell Roundhand",cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#3b2013;color:var(--cream);font-family:var(--cn);font-weight:400;line-height:1.7}
img{display:block;max-width:100%}
.page{width:100%;max-width:600px;margin:0 auto;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 0 60px rgba(0,0,0,.4)}

/* ---------- 主視覺（座標皆為相對 375×562 設計稿的百分比） ---------- */
.hero{position:relative;aspect-ratio:375/562;background:var(--bg)}
.hero .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(180deg,rgba(167,106,65,0),var(--bg));pointer-events:none}
.abs{position:absolute;z-index:2}
.lines{left:0;top:3%;width:70%;z-index:1}
.title{left:7.5%;top:8%;width:49.6%}
.time{left:7.5%;top:21.4%;width:16.8%}
.una{left:12.8%;top:69.5%;width:74.7%}
.venue{left:6.4%;top:90.6%;width:87.5%}

/* ---------- 曲目（照片 33%、間距 10.7%，整組在頁面水平置中） ---------- */
.setlist{position:relative;z-index:1;display:grid;grid-template-columns:33.07% auto;column-gap:10.7%;justify-content:center;padding:40px 0;align-items:center}
.setlist-photo img{width:100%;height:auto;border-radius:3px}
.script{font-family:var(--script);font-weight:400;color:var(--gold);line-height:1}
.sec-title .script{font-size:32px}
.sec-title h2{font-weight:500;font-size:20px;letter-spacing:.12em;margin-top:2px}
.songs{list-style:none;margin-top:calc(8% + .58em);display:flex;flex-direction:column;gap:14px;font-size:16px;letter-spacing:.14em}
.songs li{display:flex;gap:12px;align-items:baseline}
.songs .no{color:var(--gold);letter-spacing:.04em;font-variant-numeric:tabular-nums}

/* ---------- 特別感謝 ---------- */
.thanks{position:relative;text-align:center;padding:40px 4%}
.lines2-wrap{position:absolute;left:0;top:0;width:100%;transform:translateY(-52%);pointer-events:none;z-index:0}
.lines2-wrap img{width:100%;height:auto}
.thanks .t-head,.thanks .credits{position:relative;z-index:1}
.thanks .script{font-size:32px}
.thanks h2{font-weight:600;font-size:20px;letter-spacing:.12em;margin-bottom:calc(7% + .2em)}
.credits{display:grid;grid-template-columns:1fr 1fr;column-gap:0;row-gap:14px;font-size:16px;letter-spacing:.04em;margin:0 auto;max-width:520px}
.credits dt{text-align:right;white-space:nowrap}
.credits dd{text-align:left}
.credits .all{grid-column:1/-1;text-align:center}
/* 頁尾圖：脫離內距，永遠左右貼齊頁面 */
.footer{display:block;width:100%;height:auto;margin:0}

/* ---------- 入場動畫 ---------- */
/* 刷進：由左向右揭開 */
.wipe{clip-path:inset(0 100% 0 0);opacity:0}
.is-ready .wipe{animation:wipe 1.6s var(--ease) forwards;animation-delay:var(--d,0s)}
@keyframes wipe{0%{clip-path:inset(0 100% 0 0);opacity:0}12%{opacity:1}100%{clip-path:inset(0 -1% 0 0);opacity:1}}
.fade{opacity:0}
.is-ready .fade{animation:fadein 2.2s ease forwards;animation-delay:var(--d,0s)}
@keyframes fadein{to{opacity:1}}
.hero .photo{opacity:0;transition:opacity 2s ease}
.is-ready .hero .photo{opacity:1}
/* 捲動淡入 */
.reveal{opacity:0;transform:translateY(16px);filter:blur(4px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease),filter 1.1s var(--ease);transition-delay:var(--d,0s)}
.reveal.in{opacity:1;transform:none;filter:none}
.setlist-photo img{clip-path:inset(0 0 100% 0);transition:clip-path 1.7s var(--ease)}
.setlist-photo.in img{clip-path:inset(0 0 0 0)}
.rv-fade{opacity:0;transition:opacity 1.6s ease}
.rv-fade.in{opacity:1}

@media (prefers-reduced-motion:reduce){
  .wipe,.fade,.reveal,.rv-fade,.hero .photo,.setlist-photo img{animation:none!important;transition:none!important;opacity:1!important;transform:none!important;filter:none!important;clip-path:none!important}
}
.no-js .wipe,.no-js .fade,.no-js .reveal,.no-js .rv-fade,.no-js .hero .photo,.no-js .setlist-photo img{opacity:1;transform:none;filter:none;clip-path:none}
</style>
</head>
<body class="no-js">
<main class="page">

  <header class="hero">
    <img class="photo" src="images/hero.jpg" alt="Una 演奏古箏">
    <img class="abs lines fade" src="images/lines.svg" alt="" style="--d:.2s">
    <img class="abs title wipe" src="images/title.svg" alt="箏心如願" style="--d:.4s">
    <img class="abs time wipe" src="images/time.svg" alt="2026年12月12日 週六 下午2:00至3:00" style="--d:1s">
    <img class="abs una wipe" src="images/una.svg" alt="Una's Guzheng" style="--d:1.4s">
    <img class="abs venue wipe" src="images/venue.svg" alt="Rendezvous 秘點" style="--d:1.9s">
  </header>

  <section class="setlist" aria-labelledby="setlist-h">
    <div class="setlist-photo"><img src="images/setlist.png" alt="Una 與古箏"></div>
    <div>
      <div class="sec-title reveal">
        <div class="script" aria-hidden="true">Setlist</div>
        <h2 id="setlist-h">曲目</h2>
      </div>
      <ol class="songs">
        <li class="reveal" style="--d:.05s"><span class="no">01/</span>琵琶語</li>
        <li class="reveal" style="--d:.12s"><span class="no">02/</span>千與千尋</li>
        <li class="reveal" style="--d:.19s"><span class="no">03/</span>蘆葦蕩</li>
        <li class="reveal" style="--d:.26s"><span class="no">04/</span>長相思</li>
        <li class="reveal" style="--d:.33s"><span class="no">05/</span>茉莉芬芳</li>
        <li class="reveal" style="--d:.40s"><span class="no">06/</span>絕美大堂</li>
        <li class="reveal" style="--d:.47s"><span class="no">07/</span>古風組曲</li>
        <li class="reveal" style="--d:.54s"><span class="no">08/</span>青銅</li>
      </ol>
    </div>
  </section>

  <section class="thanks" aria-labelledby="thanks-h">
    <div class="lines2-wrap" aria-hidden="true"><img class="rv-fade" src="images/lines2.svg" alt=""></div>
    <div class="t-head reveal">
      <div class="script" aria-hidden="true">Thanks</div>
      <h2 id="thanks-h">特別感謝</h2>
    </div>
    <dl class="credits">
      <dt class="reveal" style="--d:0.05s">主持人：</dt><dd class="reveal" style="--d:0.05s">許韻芝</dd>
      <dt class="reveal" style="--d:0.12s">鋼琴伴奏|音箱鼓：</dt><dd class="reveal" style="--d:0.12s">楊永成</dd>
      <dt class="reveal" style="--d:0.19s">古箏伴奏：</dt><dd class="reveal" style="--d:0.19s">謝蕙如</dd>
      <dt class="reveal" style="--d:0.26s">工作人員：</dt><dd class="reveal" style="--d:0.26s">李子帆、胡郁晨</dd>
      <dt class="reveal" style="--d:0.33s">指導老師：</dt><dd class="reveal" style="--d:0.33s">時懋菁</dd>
      <dt class="reveal" style="--d:0.40s">攝影師：</dt><dd class="reveal" style="--d:0.40s">黃韋勳</dd>
      <dt class="reveal" style="--d:0.40s">設計支援：</dt><dd class="reveal" style="--d:0.40s">陳姿羽</dd>
      <dt class="reveal" style="--d:0.47s">其他感謝：</dt><dd class="reveal" style="--d:0.47s">秘點工作人員</dd>
      <dd class="all reveal" style="--d:.54s">所有來臨聽的你們</dd>
    </dl>
  </section>

  <img class="footer rv-fade" src="images/footer.png" alt="">

</main>
<script>
(function(){
  var b=document.body;b.classList.remove('no-js');
  var started=false;function start(){if(started)return;started=true;b.classList.add('is-ready')}
  var hero=document.querySelector('.hero .photo'),waits=[];
  if(document.fonts&&document.fonts.ready)waits.push(document.fonts.ready);
  if(hero&&!hero.complete)waits.push(new Promise(function(r){hero.addEventListener('load',r);hero.addEventListener('error',r)}));
  Promise.all(waits).then(start);setTimeout(start,1200);
  var items=document.querySelectorAll('.reveal,.rv-fade,.setlist-photo');
  if(!('IntersectionObserver' in window)){items.forEach(function(e){e.classList.add('in')});return}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.15,rootMargin:'0px 0px -6% 0px'});
  items.forEach(function(e){io.observe(e)});
})();
</script>
</body>
</html>
